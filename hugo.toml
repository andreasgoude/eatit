baseURL = "https://andreasgoude.github.io/eatit/"
defaultContentLanguage = "sv"
disableLanguages = ["en"]   # Congo har en engelsk språkkonfiguration som vi inte använder
title = "eatit"
theme = "congo"
enableGitInfo = false
enableRobotsTXT = true

[pagination]
  pagerSize = 24

[taxonomies]
  category = "categories"
  tag = "tags"

[languages.sv]
  locale = "sv-SE"
  title = "eatit"
  weight = 1
  [languages.sv.params.author]
    name = "Andreas Goude"

[params]
  description = "Recept som vi lagar om och om igen."
  # Länken "Redigera på GitHub" på receptsidorna
  repo = "https://github.com/andreasgoude/eatit"
  editpath = "edit/main"

  # Congo: färgschema och mörkt läge
  colorScheme = "avocado"     # congo, avocado, cherry, fire, ocean, sapphire, slate
  defaultAppearance = "light"
  autoSwitchAppearance = true # följer systemets ljust/mörkt tills man väljer själv
  enableSearch = false        # vi använder Pagefind i stället
  enableImageWebp = true
  # Typografi för instruktionerna på receptsidan (Tailwind-klasser från Congo)
  proseClass = "prose dark:prose-invert max-w-none"

  [params.header]
    layout = "basic"
    showTitle = true
  [params.footer]
    showAppearanceSwitcher = true
    showThemeAttribution = true
    showCopyright = false
    showScrollToTop = true
  [params.homepage]
    layout = "page"

[[menus.main]]
  name = "recept"
  pageRef = "/recipes"
  weight = 1
[[menus.main]]
  name = "kategorier"
  pageRef = "/categories"
  weight = 2
