<div class="recipe-meta">
  {{ with .Params.totalTime }}<span><i class="far fa-clock"></i> {{ partial "duration.html" . }}</span>{{ end }}
  {{ with .Params.servings }}<span><i class="fas fa-utensils"></i> {{ . }} port.</span>{{ end }}
  {{ with .Params.difficulty }}<span><i class="fas fa-signal"></i> {{ . }}</span>{{ end }}
</div>
