{{ define "main" }}
<section class="section">
  <div class="container">
    <div class="columns is-centered">
      <div class="column is-half">
        <div class="column has-text-centered tagtitle">
          <h1 class="title is-3">{{ .Title }}</h1>
        </div>
      </div>
    </div>
    {{- $paginator := .Paginate .Pages }}
    {{- partial "recipe-grid.html" $paginator }}
    <div class="column is-centered">{{ partial "pagination.html" . }}</div>
  </div>
</section>
{{ end }}
