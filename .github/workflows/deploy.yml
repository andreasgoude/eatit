# Bygger sidan med Hugo och publicerar den på GitHub Pages.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Bygg om varje morgon. Då publiceras recept med ett framtida datum automatiskt när dagen kommer.
  schedule:
    - cron: "0 4 * * *"   # 04:00 UTC = 05:00/06:00 svensk tid

permissions:
  contents: read
  pages: write
  id-token: write

# Bara en deploy åt gången. En pågående deploy avbryts inte, så den hinner bli klar.
concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      recipe_path: ${{ steps.latest.outputs.path }}
    env:
      TZ: Europe/Stockholm
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Hugo
        uses: ./.github/actions/setup-hugo

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - name: Install Pagefind
        run: npm ci

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Build
        env:
          HUGO_ENVIRONMENT: production
        run: |
          hugo --gc --minify --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Build search index
        run: npx pagefind --site public

      # Senaste publicerade receptet, som Lighthouse testar (t.ex. "recipes/tonfiskbiffar/").
      - name: Find latest recipe
        id: latest
        run: |
          path=$(hugo list published | python3 -c '
          import csv, sys
          rows = [r for r in csv.DictReader(sys.stdin) if r["kind"] == "page" and r["section"] == "recipes"]
          print(max(rows, key=lambda r: r["date"])["permalink"].split("/eatit/", 1)[1] if rows else "")
          ')
          echo "path=$path" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  # Mäter prestanda, tillgänglighet, bästa praxis och SEO på den publicerade sidan.
  # Rapporten laddas upp som artefakt och som tillfällig publik länk (syns i jobbets logg).
  # Jobbet kan bli rött, men deployen är redan klar när det körs.
  lighthouse:
    needs: [build, deploy]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Lighthouse
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            ${{ needs.deploy.outputs.page_url }}
            ${{ needs.deploy.outputs.page_url }}${{ needs.build.outputs.recipe_path }}
          configPath: ./.github/lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true
